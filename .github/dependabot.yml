version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react-ecosystem:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      eslint-ecosystem:
        patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'eslint-plugin-import-x'
          - 'eslint-plugin-react'
          - 'eslint-plugin-react-hooks'          
          - '@eslint-community/eslint-utils'
          - '@eslint-react/eslint-plugin'
          - '@eslint/js'
      vitest-ecosystem:
        patterns:
          - 'vitest'
          - '@vitest/ui'
